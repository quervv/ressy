[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ressy-server"
version = "1.0.0"
description = "Ressy 24/7 bot server: relays Telegram and Discord messages to each user's PC."
readme = "../README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9,<4",
    "aiosqlite>=0.20,<1",
    "python-telegram-bot>=21.6,<23",
    "discord.py>=2.4,<3",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
ressy-server = "ressy_server.main:main"

[tool.setuptools.packages.find]
include = ["ressy_server*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
